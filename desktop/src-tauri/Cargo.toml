[package]
name = "nanfeng-ai-desktop-spike"
version = "0.0.1"
edition = "2021"

[features]
launchd-acceptance = []

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
getrandom = "0.3"
futures-util = "0.3"
fs2 = "0.4"
flate2 = "1"
html5ever = "0.38"
hyper = { version = "=1.11.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
hex = "0.4"
image = { version = "0.25.5", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lopdf = "0.42"
pbkdf2 = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream", "system-proxy"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
zip = { version = "7", default-features = false, features = ["deflate"] }
quick-xml = "0.32"
zeroize = "1"
jsonschema = { version = "0.56", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
core-foundation = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

# Backport upstream wry #1795 without upgrading the shared runtime/other platforms.
# Remove after the chosen Tauri runtime consumes a released Wry with this fix.
[patch.crates-io]
wry = { path = "vendor/wry-0.55.1" }

[target.'cfg(windows)'.dependencies]
tauri-plugin-deep-link = "=2.4.7"
tauri-plugin-single-instance = { version = "=2.4.0", features = ["deep-link"] }
windows = { version = "=0.61.3", features = ["ApplicationModel_DataTransfer", "Data_Pdf", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Editing", "Media_MediaProperties", "Media_Transcoding", "Storage", "Storage_Streams", "UI", "UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-collections = "=0.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# This unusually large app crate can exhaust Windows commit during Debug codegen.
# Keep dependency symbols; omit only this crate's Debug symbols in local builds.
[profile.dev.package.nanfeng-ai-desktop-spike]
debug = 0
