android.useAndroidX=true
# KSP 2.2.10-2.0.2 registers generated sources through kotlin.sourceSets under AGP Built-in Kotlin.
android.disallowKotlinSourceSets=false
# Android lint can exhaust JBR's default code cache while assembling Release; retain
# the existing heap cap and reserve enough code cache for the single-worker build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:ReservedCodeCacheSize=320m
